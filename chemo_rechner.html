<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemo-Rechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Design wie Dosierungsrechner: fixe Patientenleiste (Tierart, Gewicht, KOF) über den Gruppen; jede Zeile endet in der Dosis. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#15212b; --muted:#5b6b78; --line:#d6dee4;
  --dog:#8a3e6b; --cat:#c2266f; --accent:var(--dog);
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --warn:#a15c00; --warn-bg:#fdf1dd; --bad:#b3261e; --bad-bg:#fbe4e2;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172129; --fg:#e5ecf1; --muted:#93a3b0; --line:#2a3742;
  --dog:#e09ac3; --cat:#ff7eb6;
  --warn:#f0b45a; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1b19;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172129; --fg:#e5ecf1; --muted:#93a3b0; --line:#2a3742;
  --dog:#e09ac3; --cat:#ff7eb6;
  --warn:#f0b45a; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1b19;
  color-scheme:dark;
}
body.cat{--accent:var(--cat)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}

/* Patientenleiste */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px}
.bar-inner{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:end;gap:12px 20px}
.brand{flex:1 1 220px;min-width:0}
.brand h1{font-size:1.35rem;line-height:1.2;text-wrap:balance}
.brand p{color:var(--muted);font-size:.85rem;margin-top:2px}
.field-label{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button svg{width:18px;height:18px;fill:currentColor}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.weight{display:flex;align-items:center;border:2px solid var(--accent);border-radius:10px;background:var(--surface);overflow:hidden}
.weight input{width:6.5ch;border:0;background:transparent;color:var(--fg);font:600 1.35rem/1 var(--f-mono);padding:7px 4px 7px 12px;text-align:right;font-variant-numeric:tabular-nums}
.weight input:focus{outline:none}
.weight input::placeholder{color:var(--muted);opacity:.6}
.weight span{padding:0 12px 0 4px;font-weight:700;color:var(--muted)}
.kofbox{display:flex;align-items:baseline;gap:4px;padding:8px 2px;font:600 1.35rem/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.kofbox small{font:700 .9rem var(--f-body)}
.printbtn{font:inherit;font-size:.85rem;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
.seg button:focus-visible,.weight:focus-within,.printbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:1240px;margin:0 auto;padding:14px 16px 32px}
.alert{margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.empty{color:var(--muted);padding:40px 0;text-align:center}
#results{display:grid;gap:18px}

/* Gruppen */
.grp{display:grid;gap:6px;align-content:start;min-width:0}
.ghead{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--accent);color:var(--accent);padding:4px 2px 6px;font:700 .8rem var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.ghead .gcount{margin-left:auto;color:var(--muted);font-family:var(--f-mono);letter-spacing:0;font-weight:600}
.sub-head{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 2px 0}
.mono-groups{display:grid;gap:6px;min-width:0}
.mono-groups .sub{display:grid;gap:6px;min-width:0}
.info{color:var(--muted);font-size:.82rem;padding:2px}

/* Zeile: Name | Dosis */
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:start;min-width:0}
.name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.name h3{font-size:1rem;line-height:1.2}
.agent{display:block;color:var(--muted);font-size:.78rem}
.tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border:1px solid var(--line);color:var(--muted);padding:1px 7px;border-radius:999px}
.drug-tag{font-size:.84rem;margin-top:1px}
.basis{font-size:.78rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.notes{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.status{font-size:.74rem;font-weight:700;padding:1px 7px;border-radius:5px;width:fit-content;max-width:100%}
.row>div{min-width:0}
.status.warn{color:var(--warn);background:var(--warn-bg)}
.status.bad{color:var(--bad);background:var(--bad-bg)}
.res{display:grid;justify-items:end;text-align:right;gap:1px}
.big{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.big .num{font:600 1.4rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.big .u{font-weight:700;font-size:.9rem;color:var(--accent)}
.sub-val{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Prämedikation: Kacheln nebeneinander */
.premed{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.premed .row{display:flex;flex-direction:column}
.premed .res{justify-items:start;text-align:left;margin-top:auto;padding-top:8px}
@media (max-width:559px){
  .premed{grid-template-columns:1fr 1fr}
  .premed .row:nth-child(3){grid-column:1/-1}
}

footer{margin-top:24px;font-size:.82rem;color:var(--muted);max-width:75ch}
footer strong{color:var(--fg)}

@media (max-width:720px){
  .brand{flex-basis:100%}
  .brand p,.bar .field-label,.printbtn{display:none}
  .brand h1{font-size:1.1rem}
  .bar{padding-block:8px}
  .bar-inner{gap:8px 12px;align-items:center}
  .seg button{padding:6px 12px}
  .weight input{font-size:1.15rem;width:5ch;padding-block:6px}
  .kofbox{font-size:1.05rem;padding:0}
  .kofbox::before{content:"KOF";font:700 .72rem var(--f-body);letter-spacing:.08em;color:var(--muted);margin-right:2px}
}

/* Desktop: Prämedikation oben, darunter Protokolle | Monotherapien (oral | Injektion/Infusion) */
@media (min-width:1100px){
  #results{grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px 20px;align-items:start}
  #results>.premed-grp,#results>.empty{grid-column:1/-1}
  #results>.protocols{display:grid;gap:18px;align-content:start}
  .mono-groups{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-items:start}
  .mono-groups .sub:first-child{grid-row:span 2}
}
@media print{
  body{background:#fff}
  .bar{position:static}
  .printbtn,.seg button[aria-pressed="false"]{display:none!important}
  .row{break-inside:avoid}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <h1>Chemo-Rechner</h1>
      <p>Zytostatika und Prämedikation für Hund und Katze</p>
    </div>
    <div>
      <span class="field-label" id="species-label">Tierart</span>
      <div class="seg" role="group" aria-labelledby="species-label">
        <button type="button" data-species="hund" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm4-3a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm4 3a2 2 0 1 1 0-4 2 2 0 0 1 0 4ZM12 11c3 0 6 4.5 6 7a3 3 0 0 1-3 3c-1.2 0-2-.6-3-.6s-1.8.6-3 .6a3 3 0 0 1-3-3c0-2.5 3-7 6-7Z"/></svg>
          Hund
        </button>
        <button type="button" data-species="katze" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l3.2 4.2A8 8 0 0 1 12 6.5c1.4 0 2.7.3 3.8.7L19 3l.8 6.4A7.4 7.4 0 0 1 20 11c0 4.8-3.6 9-8 9s-8-4.2-8-9c0-.5 0-1.1.2-1.6L5 3Zm4 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg>
          Katze
        </button>
      </div>
    </div>
    <div>
      <label class="field-label" for="weight">Körpergewicht</label>
      <div class="weight"><input id="weight" inputmode="decimal" autocomplete="off" placeholder="25,0"><span>kg</span></div>
    </div>
    <div>
      <span class="field-label">Körperoberfläche</span>
      <div class="kofbox" aria-live="polite"><span id="kof-value">–</span><small>m²</small></div>
    </div>
    <button type="button" class="printbtn" onclick="print()">Drucken</button>
  </div>
</header>

<main>
  <p class="alert" id="warn" hidden></p>
  <div id="results" aria-live="polite"></div>
  <footer>
    <p><strong>Alle Angaben ohne Gewähr.</strong> Dosierungen immer durch Tierarzt überprüfen.</p>
  </footer>
</main>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
//  STAMMDATEN – nur hier anpassen (Regeln wie im Chemo-Kostenvoranschlag)
// ════════════════════════════════════════════════════════════════════════════

// Konzentrationen der Fertiglösungen
const CONC = {
  cerenia:      {v: 10,   unit: 'mg/ml'},
  prednisolon:  {v: 125 / 2, unit: 'mg/ml', prep: '125 mg/2 ml'},
  diuren:       {v: 50,   unit: 'mg/ml'},
  vincristin:   {v: 1,    unit: 'mg/ml'},
  doxorubicin:  {v: 2,    unit: 'mg/ml'},
  epirubicin:   {v: 2,    unit: 'mg/ml'},
  vinblastin:   {v: 1,    unit: 'mg/ml'},
  carboplatin:  {v: 10,   unit: 'mg/ml'},
  mitoxantron:  {v: 2,    unit: 'mg/ml'},
  asparaginase: {v: 10000 / 4, unit: 'I.E./ml', prep: '1 Fl. 10.000 I.E. + 4 ml NaCl'},
  bleomycin:    {v: 15000 / 3, unit: 'I.E./ml', prep: '1 Fl. 15 mg = 15.000 I.E. + 3 ml NaCl'},
};

// Ab diesem Gewicht wird beim Hund nach KOF statt nach kg dosiert (Katze immer nach kg).
const KOF_THRESHOLD_KG = 15;

const CYCLO_TABS_MG = [50, 25, 15, 12.5];
const LOMUSTIN_CAPS_MG = [40, 20, 10, 5];
const MAX_DEVIATION = 0.05;                        // Cyclophosphamid: bis 5 % unter Ziel abrunden

// Leukeran (Chlorambucil): 2-mg-Tabletten, nicht teilbar; bei Bedarf 0,5-mg-Kapseln (Reformulierung).
// Hund 4 mg/m² täglich, Katze 20 mg/m² alle 2 Wochen.
// Methotrexat (nur Hund): 0,6 mg/kg PO, Tabletten 10 mg und 2,5 mg
const METHOTREXAT = {mgPerKg: 0.6, tabsMg: [10, 2.5], maxDev: 0.05};

const LEUKERAN = {tabMg: 2, capMg: 0.5, maxDev: 0.05,   // capMg: Reformulierung zu Kapseln
  hund:  {mgPerM2: 4,  schedule: 'täglich', tag: 'Monotherapie beim Lymphom'},
  katze: {mgPerM2: 20, schedule: 'alle 2 Wochen'},
  cyclo: {mgPerKg: 1.4, tag: 'Als Ersatz für Cyclophosphamid nach z. B. Zystitis'}};   // nur Hund

const ASPARAGINASE = {iePerKg: 400, maxIE: 10000};   // Maximaldosis = 1 ganze Flasche (4 ml)

// ════════════════════════════════════════════════════════════════════════════
//  HILFSFUNKTIONEN
// ════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const num = (v, d) => v.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
const ie = v => Math.round(v).toLocaleString('de-DE');
const rate = v => v.toLocaleString('de-DE', {maximumFractionDigits: 3});   // Dosisfaktor ohne überflüssige Nullen

// KOF nach Meeh: KOF (m²) = K × kg^(2/3) / 100 — Hund K = 10,1, Katze K = 10,0.
function getKOF(kg, species) {
  return (species === 'hund' ? 10.1 : 10.0) * Math.pow(kg, 2 / 3) / 100;
}

// Dosis-Basis: Hund ≥ 15 kg nach KOF, sonst nach kg (Katze immer nach kg).
// Mit species = 'hund' gilt die 15-kg-Grenze auch für die Katze (Vincristin, Doxorubicin, Cyclophosphamid).
function doseBasis(kg, kof, species, perM2, perKg) {
  return species === 'hund' && kg >= KOF_THRESHOLD_KG
    ? {mg: kof * perM2, basis: `${rate(perM2)} mg/m² × ${num(kof, 3)} m²`}
    : {mg: kg * perKg, basis: `${rate(perKg)} mg/kg × ${num(kg, 1)} kg`};
}

const byKOF = (kof, perM2) => ({mg: kof * perM2, basis: `${rate(perM2)} mg/m² × ${num(kof, 3)} m²`});

// Wenigste Tabletten/Kapseln je Menge (0,5-mg-Raster wegen 12,5 mg).
function tabletTable(maxMg, sizes) {
  const STEP = 2, units = sizes.map(s => Math.round(s * STEP));
  const limit = Math.ceil(maxMg * STEP);
  const best = [{tabs: 0, from: -1}];
  for (let a = 1; a <= limit; a++) {
    best[a] = null;
    units.forEach((u, i) => {
      const p = best[a - u];
      if (p && (!best[a] || p.tabs + 1 < best[a].tabs)) best[a] = {tabs: p.tabs + 1, from: i};
    });
  }
  const desc = a => {
    const counts = sizes.map(() => 0);
    for (let x = a; x > 0; x -= units[best[x].from]) counts[best[x].from]++;
    return sizes.map((s, i) => counts[i] ? `${counts[i]}× ${num(s, s % 1 ? 1 : 0)} mg` : '').filter(Boolean).join(' + ');
  };
  return {STEP, best, desc};
}

// Cyclophosphamid: bis 5 % unter dem Ziel die Kombination mit den wenigsten Tabletten
// (bei gleicher Anzahl die höhere Dosis). Passt nichts: nächstliegende Dosis + Hinweis.
function cycloTablets(target) {
  const {STEP, best, desc} = tabletTable(target + Math.max(...CYCLO_TABS_MG), CYCLO_TABS_MG);
  const lo = Math.ceil(target * (1 - MAX_DEVIATION) * STEP - 1e-9), t = Math.floor(target * STEP + 1e-9);
  let pick = -1;
  for (let a = t; a >= Math.max(lo, 1); a--)
    if (best[a] && (pick < 0 || best[a].tabs < best[pick].tabs)) pick = a;
  if (pick >= 0) return {mg: pick / STEP, desc: desc(pick), note: ''};
  for (let a = 1; a < best.length; a++) {
    if (!best[a]) continue;
    const d = Math.abs(a / STEP - target), bd = pick < 0 ? Infinity : Math.abs(pick / STEP - target);
    if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && a / STEP <= target)) pick = a;
  }
  return {mg: pick / STEP, desc: desc(pick),
    note: 'Keine Kombination bis 5 % unter Ziel möglich – Dosierung individuell durch Tierarzt festlegen'};
}

// Lomustin (Kapseln in 5-mg-Schritten):
//   Hund: auf den nächsten 5-mg-Schritt abrunden; fehlt bis zum nächsthöheren Schritt
//         höchstens 1 mg, wird aufgerundet (z. B. 44,7 → 45 mg, aber 68,3 → 65 mg).
//   Katze: Praxistabelle nach kg; Zwischengewichte → Nachbarwert, der am nächsten an der
//         Zieldosis liegt. Knapp dazwischen oder außerhalb der Tabelle → Rücksprache Tierarzt.
const LOMUSTIN_ROUND_UP_MG = 1;
const LOMUSTIN_CAT_TIE_MG = 0.5;
const LOMUSTIN_CAT_TABLE = {2: 5, 3: 10, 4: 10, 5: 10, 6: null, 7: 15, 8: 15, 9: null, 10: null, 11: 20, 12: 20};
const LOMUSTIN_VET_NOTE = 'Rücksprache Tierarzt – Dosierung individuell festlegen';

function lomustin(kg, kof, species, mgPerM2) {
  const target = kof * mgPerM2;
  let dose = Math.floor(target / 5) * 5;
  if (dose + 5 - target <= LOMUSTIN_ROUND_UP_MG + 1e-9) dose += 5;
  let note = dose < 5 ? LOMUSTIN_VET_NOTE : '', extra = '';
  if (species === 'katze') {
    const keys = [...new Set([Math.floor(kg), Math.ceil(kg)])];
    const doses = keys.map(k => LOMUSTIN_CAT_TABLE[k]).filter(Boolean)
      .sort((a, b) => Math.abs(a - target) - Math.abs(b - target) || a - b);
    const lo5 = Math.floor(target / 5) * 5;
    const tie = keys.length > 1 && Math.abs((target - lo5) - (lo5 + 5 - target)) < LOMUSTIN_CAT_TIE_MG;
    if (doses.length && !tie) {
      dose = doses[0];
      extra = ` · Praxistabelle ${keys.map(k => num(k, 0)).join('–')} kg`;
    } else note = LOMUSTIN_VET_NOTE;
  }
  dose = Math.max(dose, 5);
  const {STEP, desc} = tabletTable(dose, LOMUSTIN_CAPS_MG);
  return {
    name: 'Lomustin', route: 'PO', dose: `${num(dose, 0)} mg`, unit: desc(dose * STEP),
    basis: `Ziel ${num(target, 1)} mg · ${mgPerM2} mg/m² × ${num(kof, 3)} m²${extra}`, note,
  };
}

// Leukeran: zuerst 2-mg-Tabletten (nächstliegende Anzahl, bei Gleichstand weniger).
// Weicht das mehr als 5 % vom Ziel ab → 0,5-mg-Kapseln (Reformulierung) mit Hinweis.
// Passen auch die Kapseln nicht auf 5 % → zusätzlich Rücksprache Tierarzt.
function leukeranRound(target) {
  const round = unit => {
    const n = Math.max(1, Math.round(target / unit - 1e-9)), mg = n * unit;
    return {n, unit, mg, dev: (mg - target) / target, ok: Math.abs(mg - target) / target <= LEUKERAN.maxDev + 1e-9};
  };
  const tab = round(LEUKERAN.tabMg), cap = round(LEUKERAN.capMg);
  // Kapseln nur, wenn sie eine andere (genauere) Dosis ergeben als die Tabletten
  const useCap = !tab.ok && Math.abs(cap.mg - tab.mg) > 1e-9;
  const r = useCap ? cap : tab;
  const notes = [];
  if (useCap) notes.push(`Mit ${num(LEUKERAN.tabMg, 0)}-mg-Tabletten nicht genau dosierbar (${num(tab.mg, 0)} mg) – Reformulierung zu ${num(LEUKERAN.capMg, 1)}-mg-Kapseln nötig`);
  if (!r.ok) notes.push(`${useCap ? 'Auch mit Kapseln' : 'Auch mit Tabletten oder Kapseln'} nicht genau dosierbar – Rücksprache Tierarzt`);
  const dev = `${r.dev > 0 ? '+' : ''}${num(r.dev * 100, 0)} %`;
  return {r, dev, notes, form: useCap ? 'Kps.' : 'Tbl.'};
}

function leukeranRow({tag, target, schedule, basis, given}) {
  const x = leukeranRound(target);
  return {
    name: 'Leukeran', route: 'PO', tag, dose: `${num(x.r.mg, x.r.mg % 1 ? 1 : 0)} mg`,
    unit: `${x.r.n}× ${num(x.r.unit, x.r.unit % 1 ? 1 : 0)} mg ${x.form}${schedule ? ' ' + schedule : ''}`,
    basis: `Ziel ${num(target, 2)} mg · ${basis} · gegeben ${given(x.r.mg)} (${x.dev})`,
    note: x.notes,
  };
}

// Monotherapie: Hund 4 mg/m² täglich, Katze 20 mg/m² alle 2 Wochen
function leukeran(kof, species) {
  const cfg = LEUKERAN[species], target = kof * cfg.mgPerM2;
  return leukeranRow({tag: cfg.tag, target, schedule: cfg.schedule,
    basis: `${cfg.mgPerM2} mg/m² × ${num(kof, 3)} m² ${cfg.schedule}`,
    given: mg => `${num(mg / kof, 1)} mg/m²`});
}

// Hund: 1,4 mg/kg als Ersatz für Cyclophosphamid
// Methotrexat: auf die nächstliegende mögliche Dosis runden (bei Gleichstand weniger),
// mit möglichst wenigen Tabletten. Mehr als 5 % Abweichung → Rücksprache Tierarzt.
function methotrexat(kg) {
  const c = METHOTREXAT, target = kg * c.mgPerKg, step = Math.min(...c.tabsMg);
  const mg = Math.max(1, Math.round(target / step - 1e-9)) * step, dev = (mg - target) / target;
  let rest = mg;
  const parts = c.tabsMg.map(t => { const n = Math.floor(rest / t + 1e-9); rest -= n * t; return n ? `${n}× ${num(t, t % 1 ? 1 : 0)} mg` : ''; })
    .filter(Boolean);
  return {
    name: 'Methotrexat', route: 'PO', dose: `${num(mg, mg % 1 ? 1 : 0)} mg`, unit: parts.join(' + '),
    basis: `Ziel ${num(target, 2)} mg · ${rate(c.mgPerKg)} mg/kg × ${num(kg, 1)} kg · ` +
           `gegeben ${num(mg / kg, 2)} mg/kg (${dev > 0 ? '+' : ''}${num(dev * 100, 0)} %)`,
    note: Math.abs(dev) > c.maxDev + 1e-9 ? 'Mit 10-mg- und 2,5-mg-Tabletten nicht genau dosierbar – Rücksprache Tierarzt' : '',
  };
}

function leukeranCyclo(kg) {
  const c = LEUKERAN.cyclo, target = kg * c.mgPerKg;
  return leukeranRow({tag: c.tag, target, schedule: '',
    basis: `${rate(c.mgPerKg)} mg/kg × ${num(kg, 1)} kg`,
    given: mg => `${num(mg / kg, 2)} mg/kg`});
}

// ════════════════════════════════════════════════════════════════════════════
//  WIRKSTOFFE
// ════════════════════════════════════════════════════════════════════════════

// Injektionslösung: Volumen groß, Gesamtmenge klein
function inj(name, route, d, conc, opts = {}) {
  const ml = d.mg / conc.v, isIE = conc.unit.startsWith('I.E.');
  return {
    name, route, capped: !!opts.capped,
    dose: `${num(ml, opts.mlDigits ?? 2)} ml`,
    unit: isIE ? `${ie(d.mg)} I.E. gesamt` : `${num(d.mg, opts.mgDigits ?? 2)} mg gesamt`,
    basis: `${d.basis} · ${rate(conc.v)} ${conc.unit}${conc.prep ? ` (${conc.prep})` : ''}`,
  };
}

// Begleitmedikation vor der Chemo (Hund und Katze)
//   Cerenia (Maropitant) 1 mg/kg IV,
//   Prednisolon 1 mg/kg IV – nur bei Doxorubicin/Epirubicin, bei Bedarf bei Vincristin mit 2 mg/kg,
//   Diuren (Furosemid) 4 mg/kg SC – nur Hund, nur zusätzlich bei Cyclophosphamid
const PRED_VINC_MG_PER_KG = 2;   // Prednisolon bei Vincristin (bei Bedarf)

function premeds(kg, species) {
  const perKg = (name, agent, route, mgPerKg, conc, note = '') => ({
    ...inj(name, route, {mg: kg * mgPerKg, basis: `${rate(mgPerKg)} mg/kg × ${num(kg, 1)} kg`}, conc),
    agent, note,
  });
  const predVinc = kg * PRED_VINC_MG_PER_KG;
  return [
    perKg('Cerenia', 'Maropitant', 'IV', 1, CONC.cerenia),
    perKg('Prednisolon', 'Prednisolon', 'IV', 1, CONC.prednisolon, [
      'Nur bei Doxorubicin und Epirubicin',
      `Bei Bedarf bei Vincristin: ${rate(PRED_VINC_MG_PER_KG)} mg/kg = ${num(predVinc / CONC.prednisolon.v, 2)} ml (${num(predVinc, 2)} mg)`,
    ]),
    ...(species === 'hund' ? [perKg('Diuren', 'Furosemid', 'SC', 4, CONC.diuren, 'Nur zusätzlich bei Cyclophosphamid')] : []),
  ];
}

// Hund und Katze gleich: unter 15 kg nach kg, ab 15 kg nach KOF
function vincristin(kg, kof, perM2, perKg) {
  return inj('Vincristin', 'IV', doseBasis(kg, kof, 'hund', perM2, perKg), CONC.vincristin, {mgDigits: 3});
}

function doxorubicin(kg, kof, species) {
  // Hund: unter 15 kg 1 mg/kg, ab 15 kg 30 mg/m² · Katze: unter 15 kg 1 mg/kg, ab 15 kg 25 mg/m²
  return inj('Doxorubicin', 'IV', doseBasis(kg, kof, 'hund', species === 'katze' ? 25 : 30, 1), CONC.doxorubicin);
}

function cyclophosphamid(kg, kof, species) {
  // Hund: unter 15 kg 10 mg/kg, ab 15 kg 250 mg/m² · Katze: unter 15 kg 10 mg/kg, ab 15 kg 200 mg/m²
  const d = doseBasis(kg, kof, 'hund', species === 'katze' ? 200 : 250, 10);
  const t = cycloTablets(d.mg);
  return {name: 'Cyclophosphamid', route: 'PO', dose: `${num(t.mg, t.mg % 1 ? 1 : 0)} mg`, unit: t.desc,
          basis: `Ziel ${num(d.mg, 1)} mg · ${d.basis}`, note: t.note};
}

function asparaginase(kg) {
  const raw = kg * ASPARAGINASE.iePerKg, capped = raw > ASPARAGINASE.maxIE;
  const d = {mg: Math.min(raw, ASPARAGINASE.maxIE),
             basis: capped ? `Limit ${ie(ASPARAGINASE.maxIE)} I.E. (berechnet: ${ie(raw)} I.E.)`
                           : `${ASPARAGINASE.iePerKg} I.E./kg × ${num(kg, 1)} kg`};
  return inj('Asparaginase', 'SC', d, CONC.asparaginase, {capped});
}

function bleomycin(kof) {
  return inj('Bleomycin', 'IV', {mg: kof * 15000, basis: `15.000 I.E./m² × ${num(kof, 3)} m²`}, CONC.bleomycin);
}

function buildSections(kg, species) {
  const kof = getKOF(kg, species), dog = species === 'hund';
  const sections = [
    {title: 'B-Zell Lymphom · CHOP-Protokoll', drugs: [
      vincristin(kg, kof, 0.7, 0.025),
      cyclophosphamid(kg, kof, species),
      doxorubicin(kg, kof, species),
    ]},
    // T-Zell-Protokoll nur beim Hund
    ...(dog ? [{title: 'T-Zell Lymphom · LOPP-Protokoll', drugs: [
      vincristin(kg, kof, 0.5, 0.018),
      lomustin(kg, kof, species, 60),
    ]}] : []),
  ];
  // Carboplatin, Epirubicin, Mitoxantron, Vinblastin: nur Hund (wie im Kostenvoranschlag)
  // Monotherapien nach Applikationsart, innerhalb der Gruppe alphabetisch
  const abc = list => list.sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const groups = [
    {title: 'Orale Chemotherapie', drugs: abc([
      leukeran(kof, species),
      ...(dog ? [leukeranCyclo(kg), methotrexat(kg)] : []),
      lomustin(kg, kof, species, dog ? 70 : 40),
    ])},
    {title: 'Injektion (IV / SC)', drugs: abc([
      asparaginase(kg),
      bleomycin(kof),
      ...(dog ? [inj('Vinblastin', 'IV', byKOF(kof, 2), CONC.vinblastin)] : []),
    ])},
    {title: 'Intravenöse Infusion', drugs: abc(dog ? [
      inj('Carboplatin', 'IV', byKOF(kof, 300), CONC.carboplatin, {mlDigits: 1, mgDigits: 0}),
      inj('Epirubicin',  'IV', doseBasis(kg, kof, species, 30, 1), CONC.epirubicin),
      inj('Mitoxantron', 'IV', byKOF(kof, 5), CONC.mitoxantron),
    ] : [])},
  ].filter(g => g.drugs.length);
  sections.push({title: 'Monotherapien', groups,
    info: dog ? '' : 'Carboplatin, Epirubicin, Mitoxantron und Vinblastin bei der Katze nur nach Rücksprache Tierarzt (abweichende Dosierung).'});
  return {kof, sections, premeds: premeds(kg, species)};
}

// ════════════════════════════════════════════════════════════════════════════
//  AUSGABE
// ════════════════════════════════════════════════════════════════════════════
// "2,50 ml" → große Zahl + Einheit
function bigValue(v) {
  const i = v.lastIndexOf(' ');
  return `<div class="big"><span class="num">${v.slice(0, i)}</span><span class="u">${v.slice(i + 1)}</span></div>`;
}

function notesHtml(d) {
  const list = [].concat(d.note || []);
  if (d.capped) list.unshift('Max.');
  return list.length
    ? `<div class="notes">${list.map(n => `<span class="status ${/Rücksprache/.test(n) ? 'bad' : 'warn'}">${n}</span>`).join('')}</div>`
    : '';
}

function drugRow(d) {
  return `<div class="row">
    <div>
      <div class="name"><h3>${d.name}</h3><span class="tag">${d.route}</span></div>
      ${d.agent ? `<span class="agent">${d.agent}</span>` : ''}
      ${d.tag ? `<div class="drug-tag">${d.tag}</div>` : ''}
      <div class="basis">${d.basis}</div>
      ${notesHtml(d)}
    </div>
    <div class="res">${bigValue(d.dose)}<span class="sub-val">${d.unit}</span></div>
  </div>`;
}

const groupHead = (title, n) => `<h2 class="ghead">${title}<span class="gcount">${n}</span></h2>`;

const sectionHtml = s => {
  const n = s.groups ? s.groups.reduce((a, g) => a + g.drugs.length, 0) : s.drugs.length;
  return `<section class="grp">${groupHead(s.title, n)}` +
    (s.groups
      ? `<div class="mono-groups">${s.groups.map(g => `<div class="sub"><p class="sub-head">${g.title}</p>${g.drugs.map(drugRow).join('')}</div>`).join('')}</div>`
      : s.drugs.map(drugRow).join('')) +
    (s.info ? `<p class="info">${s.info}</p>` : '') + `</section>`;
};

let species = 'hund';

function render() {
  const kg = parseFloat(String($('weight').value).replace(',', '.'));
  const warn = $('warn');
  warn.hidden = true;

  if (!(kg > 0)) {
    $('kof-value').textContent = '–';
    $('results').innerHTML = `<p class="empty">Gewicht eingeben, um die Dosierungen zu berechnen.</p>`;
    return;
  }
  if ((species === 'katze' && kg > 15) || kg > 100) {
    warn.textContent = `Ungewöhnliches Gewicht für ${species === 'katze' ? 'eine Katze' : 'einen Hund'} – bitte Eingabe prüfen.`;
    warn.hidden = false;
  }

  const {kof, sections, premeds} = buildSections(kg, species);
  $('kof-value').textContent = num(kof, 3);

  $('results').innerHTML =
    `<section class="grp premed-grp">${groupHead('Prämedikation', premeds.length)}` +
    `<div class="premed" style="--n:${premeds.length}">${premeds.map(drugRow).join('')}</div></section>` +
    `<div class="protocols">${sections.filter(s => !s.groups).map(sectionHtml).join('')}</div>` +
    sections.filter(s => s.groups).map(sectionHtml).join('');
}

document.querySelectorAll('.seg button').forEach(btn => btn.addEventListener('click', () => {
  species = btn.dataset.species;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  document.body.classList.toggle('cat', species === 'katze');
  $('weight').placeholder = species === 'hund' ? '25,0' : '4,5';
  render();
}));
$('weight').addEventListener('input', render);
render();
</script>
</body>
</html>
