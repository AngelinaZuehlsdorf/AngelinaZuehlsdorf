<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemo-Kostenvoranschlag</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.42.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --soft:#f0efec; --text:#1d1d1b; --muted:#6b6a66;
  --border:#e2e0db; --border-strong:#cfccc5;
  --accent:#1f5fa8; --accent-soft:#e6f1fb;
  --iv-bg:#e6f1fb; --iv-fg:#0c447c; --po-bg:#faeeda; --po-fg:#633806;
  --warn-bg:#fdf3d8; --warn-fg:#6b4a00;
  --radius:10px; --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191918; --card:#232321; --soft:#2c2c2a; --text:#ecebe7; --muted:#a3a19b;
  --border:#3a3936; --border-strong:#4a4945;
  --accent:#7db3ee; --accent-soft:#1d3047;
  --iv-bg:#1d3047; --iv-fg:#a9cff5; --po-bg:#3d2f17; --po-fg:#f0cf94;
  --warn-bg:#3d3214; --warn-fg:#f3d98a;
}}
:root[data-theme="dark"]{
  --bg:#191918; --card:#232321; --soft:#2c2c2a; --text:#ecebe7; --muted:#a3a19b;
  --border:#3a3936; --border-strong:#4a4945;
  --accent:#7db3ee; --accent-soft:#1d3047;
  --iv-bg:#1d3047; --iv-fg:#a9cff5; --po-bg:#3d2f17; --po-fg:#f0cf94;
  --warn-bg:#3d3214; --warn-fg:#f3d98a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:1.25rem 16px 2rem}
h1{font-size:20px;font-weight:600;margin-bottom:14px}
.section-header{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:12px}
.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}

.species-toggle{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;margin-bottom:14px}
.species-btn{flex:1;height:40px;border:none;background:transparent;cursor:pointer;font:inherit;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.species-btn+.species-btn{border-left:1px solid var(--border-strong)}
.species-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.species-btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input[type=number]{width:100%;height:42px;padding:0 12px;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border-strong);border-radius:8px}
.kof{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:8px;padding:10px 14px;margin-top:12px}
.kof span:first-child{font-size:13px;color:var(--muted)}
.kof strong{font-size:18px;font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px}

.placeholder{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:14px}
.placeholder i{font-size:32px;display:block;margin-bottom:8px}

.chemo{padding:0;overflow:hidden}
.chemo summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 1.25rem}
.chemo summary::-webkit-details-marker{display:none}
.chemo summary .chev{color:var(--muted);transition:transform .15s}
.chemo[open] summary .chev{transform:rotate(90deg)}
.chemo-name{flex:1;min-width:0}
.chemo-name b{font-size:15px;font-weight:600;display:block}
.chemo-name small{font-size:12px;color:var(--muted)}
.chemo-total{font-size:18px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chemo-body{padding:0 1.25rem 1rem;border-top:1px solid var(--border)}
.chemo-body .section-header{margin-top:14px}

.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:none}
.row .desc{font-size:11px;color:var(--muted);margin-top:2px}
.note{display:block;width:fit-content;max-width:100%;font-size:11px;font-weight:600;background:var(--warn-bg);color:var(--warn-fg);border-radius:4px;padding:2px 6px;margin-top:4px}
.row .price{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.subtotal{display:flex;justify-content:space-between;padding-top:8px;margin-top:2px;border-top:1px solid var(--border-strong);font-size:13px;font-weight:600}
.group-h{margin:18px 0 8px}
.subtotal span:first-child{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:600;vertical-align:middle}
.badge-iv{background:var(--iv-bg);color:var(--iv-fg)}
.badge-po{background:var(--po-bg);color:var(--po-fg)}

.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}
.toolbar button{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--border-strong);border-radius:6px;padding:4px 10px;cursor:pointer}
.disclaimer{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

@media print{
  body{background:#fff}
  .toolbar,.species-toggle,.chev{display:none!important}
  .card{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Chemotherapie – Kostenvoranschlag</h1>

  <section class="card" aria-labelledby="patient-h">
    <p class="section-header" id="patient-h">Patient</p>
    <span class="field-label" id="species-label">Spezies</span>
    <div class="species-toggle" role="group" aria-labelledby="species-label">
      <button type="button" class="species-btn" data-species="hund" aria-pressed="true"><i class="ti ti-dog" aria-hidden="true"></i> Hund</button>
      <button type="button" class="species-btn" data-species="katze" aria-pressed="false"><i class="ti ti-cat" aria-hidden="true"></i> Katze</button>
    </div>
    <label class="field-label" for="weight">Körpergewicht (kg)</label>
    <input type="number" id="weight" inputmode="decimal" min="0.1" max="100" step="0.1" placeholder="z. B. 25,0" autocomplete="off">
    <div class="kof" id="kof" hidden><span>Körperoberfläche (KOF)</span><strong id="kof-value"></strong></div>
    <div class="warn" id="warn" hidden></div>
  </section>

  <div id="results" aria-live="polite"></div>

  <p class="disclaimer">Alle Angaben ohne Gewähr. Dosierungen immer durch Tierarzt überprüfen.</p>
</main>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
//  PREISE & STAMMDATEN – nur hier anpassen
// ════════════════════════════════════════════════════════════════════════════

// Cerenia Tabletten: Packung = 4 Tabletten (= 4 Tage), Tabletten teilbar.
const CERENIA_PO_PACKS = [
  {mg: 16,  price: 20.85},
  {mg: 24,  price: 27.13},
  {mg: 60,  price: 51.61},
  {mg: 160, price: 70.98},
];
const CERENIA_PO_MG_PER_KG = 2;
const CERENIA_IV = {mgPerKg: 1, mgPerMl: 10, pricePerMl: 11.03};

const VINCRISTIN_VIAL_PRICE = 66.00;                 // Cellcristin 2 ml / 2 mg
const DOXO = {mgPerMl: 2, pricePerMl: 17.09, surcharge: 2.38};   // Doxorubicin HCL Teva 2 mg/ml, Zuschlag je Gabe

const CYCLO_TABS = [
  {mg: 50, price: 12.75}, {mg: 25, price: 13.93},
  {mg: 15, price: 13.32}, {mg: 12.5, price: 13.13},
];
const LOMUSTIN_CAPS = [
  {mg: 40, price: 89.06}, {mg: 20, price: 53.79},
  {mg: 10, price: 38.37}, {mg: 5, price: 27.28},
];

// Ab diesem Gewicht wird beim Hund nach KOF statt nach kg dosiert.
const KOF_THRESHOLD_KG = 15;

// ── Standardleistungen (gemeinsame Basis + Zusätze je Protokoll) ────────────
// Format: [Bezeichnung, Einzelpreis, Anzahl (optional, Standard 1)]
const STD_BASE = [
  ['34 Folgeuntersuchung mit Beratung', 32.89],
  ['627 Blutprobenentnahme venös', 17.09],
  ['608 Aufbereitung von Blutproben', 45.15],
  ['618 Großes Blutbild, maschinell', 39.18],
  ['VBM ProCyte Hämatologie', 12.14],
  ['143 | §8 Auswertung von Laborwerten einfach', 41.65],
  ['VBM Sprechstunde', 6.56],
  ['VBM Blutentnahme', 9.52],
  ['1 | §8 Beratung über Laborbefunde', 18.76],
];
const STD_IV = [
  ['Apo Chemo Herstellen', 107.10],
  ['VBM Apo Chemo herstellen', 38.37],
  ['225 Venenkatheter peripher einlegen', 24.36],
  ['224 Injektion IV', 28.74, 2],
  ['226 Venenkatheter entfernen', 10.98],
];
const STD = {
  vincristin: [...STD_BASE, ...STD_IV,
    ['VBM VCX', 35.06],
    ['Isot. NaCl 0,9 % (20 ml)', 1.00]],
  doxorubicin: [...STD_BASE, ...STD_IV,
    ['609 Blutuntersuchung photometrisch', 15.38, 2],
    ['Catalyst BUN Harnstoff-Stickstoff', 10.39],
    ['Catalyst CREA Creatinin', 10.39],
    ['VBM Catalyst One IDEXX', 6.19],
    ['Medrate Solubile | Methylprednisolon', 30.66],
    ['234 Infusion per Schwerkraft', 69.97],
    ['Isot. NaCl 0,9 % (500 ml)', 4.94],
    ['VBM Doxo', 35.06]],
  tabletten: [...STD_BASE,
    ['210 Eingeben von Medikamenten', 6.88],
    ['VBM Zytostatika Tabletten', 11.57],
    ['Praxis FeliGum Trojaner (St)', 2.42]],
};

// ════════════════════════════════════════════════════════════════════════════
//  HILFSFUNKTIONEN
// ════════════════════════════════════════════════════════════════════════════
const eur = new Intl.NumberFormat('de-DE', {style: 'currency', currency: 'EUR'});
const num = (v, d) => v.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
const cents = v => Math.round(v * 100) / 100;   // jede Position auf Cent runden, wie auf der Rechnung
const sum = rows => cents(rows.reduce((a, r) => a + r.price, 0));

// KOF nach Meeh: KOF (m²) = K × kg^(2/3) / 100 — Hund K = 10,1, Katze K = 10,0.
// Ersetzt die Tabelle (hatte Tippfehler bei 22/33/47 kg und endete bei 50 kg bzw. 10 kg).
function getKOF(kg, species) {
  return (species === 'hund' ? 10.1 : 10.0) * Math.pow(kg, 2 / 3) / 100;
}

// Tabletten-/Kapselkombination: möglichst nah an der Zieldosis,
// bei gleichem Abstand lieber abrunden, dann günstigster Preis.
// Dynamische Programmierung über die mg-Menge (0,5-mg-Raster) statt Brute-Force.
function bestTablets(target, sizes) {
  const STEP = 2;                                  // 1 Einheit = 0,5 mg (wegen 12,5 mg)
  const units = sizes.map(s => Math.round(s.mg * STEP));
  const limit = Math.ceil(target * STEP) + Math.max(...units);
  const cost = new Array(limit + 1).fill(Infinity);
  const from = new Array(limit + 1).fill(-1);
  cost[0] = 0;
  for (let a = 1; a <= limit; a++) {
    for (let i = 0; i < sizes.length; i++) {
      const prev = a - units[i];
      if (prev >= 0 && cost[prev] + sizes[i].price < cost[a] - 1e-9) {
        cost[a] = cost[prev] + sizes[i].price;
        from[a] = i;
      }
    }
  }
  let best = -1;
  for (let a = 1; a <= limit; a++) {
    if (cost[a] === Infinity) continue;
    if (best < 0) { best = a; continue; }
    const d = Math.abs(a / STEP - target), bd = Math.abs(best / STEP - target);
    const under = a / STEP <= target, bUnder = best / STEP <= target;
    if (d < bd - 1e-9 ||
        (Math.abs(d - bd) < 1e-9 && under && !bUnder) ||
        (Math.abs(d - bd) < 1e-9 && under === bUnder && cost[a] < cost[best] - 1e-9)) best = a;
  }
  const counts = sizes.map(() => 0);
  for (let a = best; a > 0; a -= units[from[a]]) counts[from[a]]++;
  const parts = sizes.map((s, i) => counts[i] ? `${counts[i]}× ${num(s.mg, s.mg % 1 ? 1 : 0)} mg` : '').filter(Boolean);
  return {mg: best / STEP, price: cost[best], desc: parts.join(' + ')};
}

// ════════════════════════════════════════════════════════════════════════════
//  DOSIERUNG & MEDIKAMENTE
// ════════════════════════════════════════════════════════════════════════════

// Cerenia PO – Auswahl der Tabletten pro Tag:
//   • nie unter 2 mg/kg, sonst so nah wie möglich an 2 mg/kg
//   • höchstens 2 Tabletten pro Tag
//   • entweder EINE Größe (auch halbe Tabletten: ½, 1, 1½, 2)
//     oder ZWEI Größen mit je 1 ganzen Tablette (z. B. 16 mg + 24 mg)
//   • bei gleicher Dosis: weniger Tabletten, dann günstiger
// Kosten: immer ganze Packungen (à 4 Tbl.) für 4 Tage, z. B. 1½ Tbl./Tag = 6 Tbl. = 2 Packungen.
function cereniaPO(kg) {
  const target = CERENIA_PO_MG_PER_KG * kg;
  const P = CERENIA_PO_PACKS;
  const frac = n => ({0.5: '½', 1: '1', 1.5: '1½', 2: '2'})[n];
  const options = [];
  for (const p of P) for (const n of [0.5, 1, 1.5, 2])
    options.push({mg: p.mg * n, tabs: n, packs: [[p, Math.ceil(n)]], desc: `${frac(n)} Tbl. ${p.mg} mg`});
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++)
    options.push({mg: P[i].mg + P[j].mg, tabs: 2, packs: [[P[i], 1], [P[j], 1]],
                  desc: `je 1 Tbl. ${P[i].mg} mg + ${P[j].mg} mg`});
  for (const o of options) o.price = o.packs.reduce((a, [p, k]) => a + p.price * k, 0);
  const ok = options.filter(o => o.mg >= target - 1e-9);
  const best = ok.length
    ? ok.reduce((b, o) => (o.mg < b.mg - 1e-9 || (Math.abs(o.mg - b.mg) < 1e-9 &&
        (o.tabs < b.tabs || (o.tabs === b.tabs && o.price < b.price)))) ? o : b)
    : options.reduce((b, o) => o.mg > b.mg ? o : b);   // > 160 kg: größte mögliche Dosis
  return {
    name: 'Cerenia PO (Heimgabe 4 Tage)', route: 'PO', price: cents(best.price),
    desc: `${best.desc} = ${num(best.mg, 1)} mg/Tag (${num(best.mg / kg, 2)} mg/kg) · ` +
          best.packs.map(([p, k]) => `${k} Pckg. ${p.mg} mg`).join(' + '),
  };
}

function cereniaIV(kg) {
  const ml = kg * CERENIA_IV.mgPerKg / CERENIA_IV.mgPerMl;
  return {
    name: 'Cerenia IV (Maropitant)', route: 'IV', price: cents(ml * CERENIA_IV.pricePerMl),
    desc: `${num(ml, 2)} ml (${CERENIA_IV.mgPerKg} mg/kg, ${CERENIA_IV.mgPerMl} mg/ml)`,
  };
}

// Dosis-Basis: Hund ≥ 15 kg nach KOF, sonst nach kg (Katze immer nach kg).
function doseBasis(kg, kof, species, perM2, perKg) {
  return species === 'hund' && kg >= KOF_THRESHOLD_KG
    ? {mg: kof * perM2, basis: `${num(perM2, 1)} mg/m² × ${num(kof, 3)} m²`}
    : {mg: kg * perKg, basis: `${num(perKg, 3)} mg/kg × ${num(kg, 1)} kg`};
}

function vincristin(kg, kof, species) {
  const d = doseBasis(kg, kof, species, 0.7, 0.025);
  return {
    name: 'Cellcristin 2 ml/2 mg (1 Flasche)', route: 'IV', price: VINCRISTIN_VIAL_PRICE,
    desc: `berechnet: ${num(d.mg, 3)} mg · ${d.basis}`,
  };
}

function doxorubicin(kg, kof, species) {
  let d;
  if (species === 'katze') {
    // Katze: 30 mg/m², aber maximal 1 mg/kg
    const byKOF = kof * 30;
    d = byKOF > kg ? {mg: kg, basis: `Limit 1 mg/kg × ${num(kg, 1)} kg`}
                   : {mg: byKOF, basis: `30 mg/m² × ${num(kof, 3)} m²`};
  } else {
    d = doseBasis(kg, kof, species, 30, 1);
  }
  const ml = d.mg / DOXO.mgPerMl;
  return {
    name: 'Doxorubicin HCL Teva 2 mg/ml', route: 'IV', price: cents(ml * DOXO.pricePerMl + DOXO.surcharge),
    desc: `${num(ml, 2)} ml × ${eur.format(DOXO.pricePerMl)} + ${eur.format(DOXO.surcharge)} Zuschlag · ${num(d.mg, 2)} mg · ${d.basis}`,
  };
}

// Cyclophosphamid: lieber ab- als aufrunden.
//   • bis 5 % unter dem Ziel: möglichst wenige Tabletten, dann die höhere Dosis, dann günstiger
//   • passt dort nichts (sehr kleine Tiere): Hinweis, dass der Tierarzt individuell
//     entscheidet; Preis vorläufig für die nächstliegende Dosis
// Mit maxDev = 0 liefert die Funktion die günstigste Kombination für genau diese Dosis.
const MAX_DEVIATION = 0.05;
function roundDownTablets(target, sizes, maxDev) {
  const STEP = 2;                                  // 1 Einheit = 0,5 mg (wegen 12,5 mg)
  const units = sizes.map(s => Math.round(s.mg * STEP));
  const lo = Math.ceil(target * (1 - maxDev) * STEP - 1e-9);
  const t = Math.floor(target * STEP + 1e-9);
  const best = [{tabs: 0, price: 0, from: -1}];    // je Menge: wenigste Tabletten, dann günstigster Preis
  for (let a = 1; a <= t; a++) {
    best[a] = null;
    sizes.forEach((s, i) => {
      const p = best[a - units[i]];
      if (!p) return;
      const c = {tabs: p.tabs + 1, price: p.price + s.price, from: i};
      if (!best[a] || c.tabs < best[a].tabs || (c.tabs === best[a].tabs && c.price < best[a].price - 1e-9)) best[a] = c;
    });
  }
  let pick = -1;
  for (let a = t; a >= Math.max(lo, 1); a--)       // von oben: bei gleicher Anzahl gewinnt die höhere Dosis
    if (best[a] && (pick < 0 || best[a].tabs < best[pick].tabs)) pick = a;
  if (pick < 0) return {...bestTablets(target, sizes),
    note: 'Keine Kombination bis 5 % unter Ziel möglich – Dosierung individuell durch Tierarzt festlegen'};
  const counts = sizes.map(() => 0);
  for (let a = pick; a > 0; a -= units[best[a].from]) counts[best[a].from]++;
  const parts = sizes.map((s, i) => counts[i] ? `${counts[i]}× ${num(s.mg, s.mg % 1 ? 1 : 0)} mg` : '').filter(Boolean);
  return {mg: pick / STEP, price: best[pick].price, desc: parts.join(' + ')};
}

function cyclophosphamid(kg, kof, species) {
  const d = doseBasis(kg, kof, species, 250, 10);
  const t = roundDownTablets(d.mg, CYCLO_TABS, MAX_DEVIATION);
  return {
    name: 'Cyclophosphamid Tabletten', route: 'PO', price: cents(t.price),
    desc: `${t.desc} = ${num(t.mg, 1)} mg · Ziel ${num(d.mg, 1)} mg (${d.basis})`,
    note: t.note || '',
  };
}

// Lomustin (Kapseln in 5-mg-Schritten):
//   Hund: auf den nächsten 5-mg-Schritt abrunden; fehlt bis zum nächsthöheren Schritt
//         höchstens 1 mg, wird aufgerundet (z. B. 44,7 → 45 mg, aber 68,3 → 65 mg).
//   Katze: Praxistabelle nach kg. Zwischengewichte (z. B. 5,5 kg): von den beiden Nachbarwerten
//         die Dosis, die am nächsten an der Zieldosis liegt (bei Gleichstand die niedrigere).
//         Ist es knapp (Zieldosis fast genau zwischen zwei 5-mg-Schritten, Abstände unterscheiden
//         sich um weniger als 0,5 mg), entscheidet der Tierarzt.
//         "null" bzw. Gewichte außerhalb der Tabelle = Rücksprache Tierarzt
//         (Preis vorläufig nach der Hunde-Regel).
const LOMUSTIN_ROUND_UP_MG = 1;
const LOMUSTIN_CAT_TIE_MG = 0.5;
const LOMUSTIN_CAT_TABLE = {2: 5, 3: 10, 4: 10, 5: 10, 6: null, 7: 15, 8: 15, 9: null, 10: null, 11: 20, 12: 20};
const LOMUSTIN_VET_NOTE = 'Rücksprache Tierarzt – Dosierung individuell festlegen, Preis vorläufig';

function lomustin(kg, kof, species, mgPerM2) {
  const target = kof * mgPerM2;
  let dose = Math.floor(target / 5) * 5;
  if (dose + 5 - target <= LOMUSTIN_ROUND_UP_MG + 1e-9) dose += 5;
  let note = dose < 5 ? LOMUSTIN_VET_NOTE : '', basis = '';
  if (species === 'katze') {
    const keys = [...new Set([Math.floor(kg), Math.ceil(kg)])];
    const doses = keys.map(k => LOMUSTIN_CAT_TABLE[k]).filter(Boolean)
      .sort((a, b) => Math.abs(a - target) - Math.abs(b - target) || a - b);
    const lo5 = Math.floor(target / 5) * 5;
    const tie = keys.length > 1 && Math.abs((target - lo5) - (lo5 + 5 - target)) < LOMUSTIN_CAT_TIE_MG;
    if (doses.length && !tie) {
      dose = doses[0];
      basis = ` · Praxistabelle ${keys.map(k => num(k, 0)).join('–')} kg`;
    } else note = LOMUSTIN_VET_NOTE;
  }
  dose = Math.max(dose, 5);
  const t = roundDownTablets(dose, LOMUSTIN_CAPS, 0);
  return {
    name: 'Lomustin Kapseln', route: 'PO', price: cents(t.price),
    desc: `${t.desc} = ${num(t.mg, 0)} mg · Ziel ${num(target, 1)} mg (${mgPerM2} mg/m² × ${num(kof, 3)} m²)${basis}`,
    note,
  };
}

// ── Alle Protokolle für Spezies + Gewicht ───────────────────────────────────
function buildEstimates(kg, species) {
  const kof = getKOF(kg, species);
  const ivAnti = cereniaIV(kg), poAnti = cereniaPO(kg);
  const list = [
    {id: 'vinc', title: 'Vincristin', tag: 'IV · B-Zell', std: STD.vincristin,
     meds: [ivAnti, vincristin(kg, kof, species), poAnti]},
    {id: 'doxo', title: 'Doxorubicin', tag: 'IV · B-Zell', std: STD.doxorubicin,
     meds: [ivAnti, doxorubicin(kg, kof, species), poAnti]},
    {id: 'cyclo', title: 'Cyclophosphamid', tag: 'PO · Tabletten', std: STD.tabletten,
     meds: [cyclophosphamid(kg, kof, species), poAnti]},
  ];
  if (species === 'katze') {
    list.push({id: 'lom60', title: 'Lomustin', tag: 'PO · 40 mg/m²', std: STD.tabletten,
               meds: [lomustin(kg, kof, species, 40), poAnti]});
  } else {
    list.push({id: 'lom70', title: 'Lomustin', tag: 'PO · B-Zell (Mono) · 70 mg/m²', std: STD.tabletten,
               meds: [lomustin(kg, kof, species, 70), poAnti]});
    list.push({id: 'lom60', title: 'Lomustin', tag: 'PO · T-Zell · 60 mg/m²', std: STD.tabletten,
               meds: [lomustin(kg, kof, species, 60), poAnti]});
  }
  for (const e of list) {
    e.stdRows = e.std.map(([name, price, qty = 1]) => ({
      name: qty > 1 ? `${name} (×${qty})` : name,
      price: cents(price * qty),
      desc: qty > 1 ? `${qty} × ${eur.format(price)}` : '',
    }));
    e.stdSum = sum(e.stdRows);
    e.medSum = sum(e.meds);
    e.total = cents(e.stdSum + e.medSum);
    e.individual = e.meds.some(m => m.note);
  }
  // Protokolle: Summe der Sitzungen (je inkl. Standardleistungen und Cerenia).
  // LOPP (nur Hund): Lomustin gibt der Besitzer am Folgetag zu Hause → nur die Kapseln, keine Sitzung.
  const s = id => list.find(e => e.id === id);
  const protocols = [
    {title: 'CHOP', tag: '12 Wochen · je 4× Vincristin, Cyclophosphamid, Doxorubicin',
     parts: [[s('vinc'), 4], [s('cyclo'), 4], [s('doxo'), 4]]},
  ];
  if (species === 'hund') protocols.push(
    {title: 'LOPP', tag: '24 Wochen · alle 2 Wochen Vincristin (12×), alle 4 Wochen Lomustin 60 mg/m² als Heimgabe (6×)',
     parts: [[s('vinc'), 12], [s('lom60').meds[0], 6]]});
  for (const p of protocols) {
    p.rows = p.parts.map(([e, n]) => e.total !== undefined
      ? {name: `${n}× ${e.title}-Sitzung`, desc: `${n} × ${eur.format(e.total)} (${e.tag})`,
         price: cents(e.total * n), note: e.individual ? 'Dosierung individuell durch Tierarzt' : ''}
      : {name: `${n}× ${e.name} (Heimgabe, nur Kapseln)`, desc: `${n} × ${eur.format(e.price)} · ${e.desc}`,
         price: cents(e.price * n), note: e.note});
    p.total = sum(p.rows);
    p.individual = p.rows.some(r => r.note);
  }
  return {kof, list, protocols};
}

// ════════════════════════════════════════════════════════════════════════════
//  UI
// ════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
let species = 'hund';
const openState = new Set();   // aufgeklappte Karten über Neuberechnungen hinweg merken

const rowHtml = r => `<div class="row"><div>${r.name}${r.route ? `<span class="badge badge-${r.route.toLowerCase()}">${r.route}</span>` : ''}${r.desc ? `<div class="desc">${r.desc}</div>` : ''}${r.note ? `<div class="note">${r.note}</div>` : ''}</div><div class="price">${eur.format(r.price)}</div></div>`;
const block = (title, rows, total) => `<p class="section-header">${title}</p>${rows.map(rowHtml).join('')}<div class="subtotal"><span>Zwischensumme</span><span>${eur.format(total)}</span></div>`;

function cardHtml(e, body) {
  const key = e.title + e.tag;
  return `<details class="card chemo" data-key="${key}"${openState.has(key) ? ' open' : ''}>
        <summary><i class="ti ti-chevron-right chev" aria-hidden="true"></i>
          <span class="chemo-name"><b>${e.title}</b><small>${e.tag}</small>${e.individual ? '<span class="note">Dosierung individuell durch Tierarzt – Preis vorläufig</span>' : ''}</span>
          <span class="chemo-total">${eur.format(e.total)}</span></summary>
        <div class="chemo-body">
          ${body}
        </div></details>`;
}

function render() {
  const kg = parseFloat(String($('weight').value).replace(',', '.'));
  const warn = $('warn');
  warn.hidden = true;

  if (!(kg > 0)) {
    $('kof').hidden = true;
    $('results').innerHTML = `<div class="placeholder"><i class="ti ti-calculator" aria-hidden="true"></i>Spezies wählen und Gewicht eingeben</div>`;
    return;
  }
  if ((species === 'katze' && kg > 15) || kg > 100) {
    warn.textContent = `Ungewöhnliches Gewicht für ${species === 'katze' ? 'eine Katze' : 'einen Hund'} – bitte Eingabe prüfen.`;
    warn.hidden = false;
  }

  const {kof, list, protocols} = buildEstimates(kg, species);
  $('kof-value').textContent = `${num(kof, 3)} m²`;
  $('kof').hidden = false;

  $('results').innerHTML =
    `<div class="toolbar"><button type="button" id="toggle-all">Alle aufklappen</button><button type="button" onclick="print()"><i class="ti ti-printer" aria-hidden="true"></i> Drucken</button></div>` +
    `<p class="section-header group-h">Einzelsitzungen</p>` +
    list.map(e => cardHtml(e, block('Medikamente', e.meds, e.medSum) + block('Standardleistungen', e.stdRows, e.stdSum))).join('') +
    `<p class="section-header group-h">Protokolle – Gesamtkosten</p>` +
    protocols.map(p => cardHtml(p, block('Sitzungen', p.rows, p.total))).join('') +
    `<p class="disclaimer">Einzelsitzungen inkl. Cerenia und Standardleistungen; Protokolle = Summe der Einzelsitzungen · ${species === 'hund' ? 'Hund' : 'Katze'}, ${num(kg, 1)} kg</p>`;

  const all = [...document.querySelectorAll('.chemo')];
  all.forEach(d => d.addEventListener('toggle', () => {
    d.open ? openState.add(d.dataset.key) : openState.delete(d.dataset.key);
  }));
  $('toggle-all').addEventListener('click', () => {
    const open = !all.every(d => d.open);
    all.forEach(d => { d.open = open; });
  });
}

document.querySelectorAll('.species-btn').forEach(btn => btn.addEventListener('click', () => {
  species = btn.dataset.species;
  document.querySelectorAll('.species-btn').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  $('weight').placeholder = species === 'hund' ? 'z. B. 25,0' : 'z. B. 4,5';
  render();
}));
$('weight').addEventListener('input', render);
// Beim Drucken alle Details zeigen
addEventListener('beforeprint', () => document.querySelectorAll('.chemo').forEach(d => { d.open = true; }));
render();
</script>
</body>
</html>
